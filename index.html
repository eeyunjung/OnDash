<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OnDash - 내 차 가이드 AI</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        background-color: #f1f5f9;
        color: #111827;
        font-size: 16px;
        line-height: 1.5;
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      button, a, input, select, textarea {
        font-family: inherit;
        font-size: 16px;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        console.error('App loading error:', e);
        var el = document.getElementById('ondash-error-box');
        if (!el) {
          el = document.createElement('div');
          el.id = 'ondash-error-box';
          el.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;max-width:400px;margin:0 auto;background:#fff;border:1.5px solid #ef4444;border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:999999;font-family:sans-serif;';
          el.innerHTML = '<h3 style="color:#b91c1c;margin:0 0 6px 0;font-size:15px;font-weight:800;">앱 초기화 오류</h3><p style="font-size:12px;color:#475569;margin:0 0 10px 0;">' + (e.message || '스크립트 로드 중 오류가 발생했습니다.') + '</p><button onclick="location.reload()" style="background:#2563eb;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;">새로고침</button>';
          document.body.appendChild(el);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
